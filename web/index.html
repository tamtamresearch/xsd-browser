<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XSD Browser</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; background: #f4f7f6; margin: 0; }
        #title { margin-top: 0; }
        .card { background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 400px; position: relative; }
        select, button, input { width: 100%; margin: 14px 0; padding: 10px; border-radius: 5px; border: 1px solid #ddd; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:disabled { background: #ccc; }
        #status { font-size: 0.8rem; color: #666; text-align: center; }
        .drop-zone { border: 2px dashed #ccc; border-radius: 8px; padding: 24px 16px; text-align: center; cursor: pointer; background: #fafbfc; margin: 14px 0; transition: border-color 0.2s, background 0.2s; }
        .drop-zone:hover { border-color: #999; background: #f0f2f4; }
        .drop-zone.drag-over { border-color: #007bff; border-style: dashed; background: #f0f7ff; }
        .drop-zone-primary { font-size: 0.95rem; color: #333; margin-bottom: 4px; }
        .drop-zone-secondary { font-size: 0.8rem; color: #999; }
        .drop-zone-secondary a { color: #666; }
        .drop-zone-secondary a:hover {
            color: #333;
        }
        #selectionInfo {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            margin: 0 0 10px;
            font-size: 0.82rem;
            color: #28a745;
            font-weight: 600;
            border: 1px dashed #28a745;
            background: transparent;
            border-radius: 6px;
        }
        #selectionName {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #entryLabel {
            font-size: 0.8rem;
            color: #555;
            display: block;
            margin-bottom: 2px;
        }
        #entryRow select { margin-top: 0; }
        #subtitle { font-size: 0.85rem; color: #666; margin: 0 0 24px; }
        .landing-footer {
            position: fixed; bottom: 0; left: 0; right: 0;
            display: flex; justify-content: space-between; align-items: center;
            background-color: #2c3e50;
            padding: 10px 16px;
        }
        .landing-footer, .landing-footer span { color: #94a3b8; font-size: 13px; }
        .landing-footer a { color: #cbd5e1; font-size: 13px; text-decoration: none; }
        .landing-footer a:hover { color: #fff; text-decoration: underline; }
    </style>
</head>
<body>

<div class="card">
    <h2 id="title">XSD Browser</h2>
    <p id="subtitle">Generate interactive, single-page HTML documentation from XSD (XML Schema) files.</p>
    <div class="drop-zone" id="dropZone">
        <div class="drop-zone-primary">Drag &amp; drop a file here</div>
        <div class="drop-zone-secondary">or click to choose a file, or <a href="#" id="folderLink">choose a folder</a></div>
    </div>
    <input type="file" id="zipInput" accept=".zip,.xsd,.tar,.tar.gz,.gz,.tgz" style="display:none">
    <input type="file" id="folderInput" webkitdirectory style="display:none">
    <div id="selectionInfo" style="display:none">
        <span id="selectionName"></span>
    </div>
<div id="entryRow" style="display:none">
        <label for="entrySelect" id="entryLabel">Select root XSD schema:</label>
        <select id="entrySelect" disabled><option>Select root XSD schema</option></select>
    </div>
    <hr style="border: none; border-top: 1px solid #e0e0e0; margin: 0 0 0;">
    <button id="convertBtn" disabled>Loading Python...</button>
    <div id="status">Initializing...</div>
</div>

<script>
    const status = document.getElementById('status');
    const btn = document.getElementById('convertBtn');
    const entrySelect = document.getElementById('entrySelect');
    const entryRow = document.getElementById('entryRow');
    const zipInput = document.getElementById('zipInput');
    const folderInput = document.getElementById('folderInput');
    const folderLink = document.getElementById('folderLink');
    const dropZone = document.getElementById('dropZone');
    const selectionInfo = document.getElementById('selectionInfo');
    const selectionName = document.getElementById('selectionName');

    let currentFile = null;
    let currentFiles = null; // pre-read files dict for directory drops

    function showSelection(name) {
        selectionName.textContent = name;
        selectionInfo.style.display = 'flex';
    }

    dropZone.onclick = () => zipInput.click();

    folderLink.onclick = (e) => {
        e.preventDefault();
        e.stopPropagation();
        folderInput.click();
    };

    folderInput.onchange = () => {
        const files = folderInput.files;
        if (!files || files.length === 0) return;
        handleFolderFiles(files);
    };

    const worker = new Worker('worker.js');
    let workerReady = false;

    worker.onmessage = (e) => {
        const { type, data } = e.data;

        switch (type) {
            case 'status':
                status.innerText = data;
                break;
            case 'ready':
                workerReady = true;
                btn.innerText = "Generate HTML";
                if (currentFile || currentFiles) {
                    btn.disabled = false;
                    status.innerText = "Ready. Click Generate to proceed.";
                } else {
                    status.innerText = "Ready.";
                }
                break;
            case 'result':
                const blob = new Blob([data.html], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `report_${data.entryPoint.replace('.xsd', '')}.html`;
                a.click();
                status.innerText = "Done! Report downloaded.";
                btn.disabled = false;
                break;
            case 'error':
                console.error(data);
                status.innerText = `Error: ${data}`;
                btn.disabled = false;
                break;
        }
    };

    function isTar(file) {
        return file.name.endsWith('.tar') || file.name.endsWith('.tar.gz') || file.name.endsWith('.tgz');
    }

    async function extractTar(file) {
        let bytes;
        if (file.name.endsWith('.tar.gz') || file.name.endsWith('.tgz')) {
            const ds = new DecompressionStream('gzip');
            file.stream().pipeTo(ds.writable);
            bytes = new Uint8Array(await new Response(ds.readable).arrayBuffer());
        } else {
            bytes = new Uint8Array(await file.arrayBuffer());
        }
        const files = {};
        let offset = 0;
        while (offset + 512 <= bytes.length) {
            const header = bytes.slice(offset, offset + 512);
            if (header.every(b => b === 0)) break;
            const name = new TextDecoder().decode(header.slice(0, 100)).replace(/\0.*/, '');
            const sizeOctal = new TextDecoder().decode(header.slice(124, 136)).trim().replace(/\0.*/, '');
            const size = parseInt(sizeOctal, 8) || 0;
            const typeFlag = String.fromCharCode(header[156]);
            offset += 512;
            if (typeFlag === '0' || typeFlag === '\0') {
                files[name] = bytes.slice(offset, offset + size);
            } else {
                files[name] = null; // directory
            }
            offset += Math.ceil(size / 512) * 512;
        }
        return files;
    }

    function readEntryAsFile(fileEntry) {
        return new Promise((resolve, reject) => fileEntry.file(resolve, reject));
    }

    async function readDirectoryEntry(dirEntry) {
        const files = {};
        const queue = [dirEntry];
        // Strip the top-level directory name so paths are relative
        const prefix = dirEntry.fullPath + '/';
        while (queue.length > 0) {
            const entry = queue.shift();
            if (entry.isFile) {
                const file = await readEntryAsFile(entry);
                const relativePath = entry.fullPath.startsWith(prefix)
                    ? entry.fullPath.slice(prefix.length) : entry.fullPath.slice(1);
                files[relativePath] = new Uint8Array(await file.arrayBuffer());
            } else if (entry.isDirectory) {
                const reader = entry.createReader();
                // readEntries may return partial results, must call until empty
                let batch;
                do {
                    batch = await new Promise((resolve, reject) => reader.readEntries(resolve, reject));
                    for (const child of batch) queue.push(child);
                } while (batch.length > 0);
            }
        }
        return files;
    }

    function resetDropZone(message) {
        currentFile = null;
        currentFiles = null;
        selectionInfo.style.display = 'none';
        entryRow.style.display = 'none';
        btn.disabled = true;
        status.innerText = message;
    }

    async function handleFolderFiles(fileList) {
        currentFile = null;
        currentFiles = null;
        // Derive folder name from the common path prefix
        const folderName = fileList[0].webkitRelativePath.split('/')[0];
        showSelection(folderName + '/');
        status.innerText = "Reading folder...";

        try {
            const allFiles = {};
            for (const file of fileList) {
                // webkitRelativePath is "folderName/sub/path.xsd" — strip the folder prefix
                const relativePath = file.webkitRelativePath.split('/').slice(1).join('/');
                if (relativePath) {
                    allFiles[relativePath] = new Uint8Array(await file.arrayBuffer());
                }
            }
            currentFiles = allFiles;
            entrySelect.innerHTML = "";
            const xsds = Object.keys(allFiles).filter(n => n.endsWith('.xsd')).sort();
            if (xsds.length === 0) {
                resetDropZone("No .xsd files found in the folder.");
                return;
            }
            xsds.forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.innerText = name;
                entrySelect.appendChild(opt);
            });
            entrySelect.disabled = false;
            entryRow.style.display = '';
            btn.disabled = !workerReady;
            status.innerText = "Folder listed. Select root XSD schema and click Generate.";
        } catch (e) {
            resetDropZone(`Error reading folder: ${e.message}`);
        }
    }

    async function handleDirectory(entry) {
        currentFile = null;
        currentFiles = null;
        showSelection(entry.name + '/');
        status.innerText = "Reading folder...";

        try {
            const allFiles = await readDirectoryEntry(entry);
            currentFiles = allFiles;
            entrySelect.innerHTML = "";
            const xsds = Object.keys(allFiles).filter(n => n.endsWith('.xsd')).sort();
            if (xsds.length === 0) {
                resetDropZone("No .xsd files found in the folder.");
                return;
            }
            xsds.forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.innerText = name;
                entrySelect.appendChild(opt);
            });
            entrySelect.disabled = false;
            entryRow.style.display = '';
            btn.disabled = !workerReady;
            status.innerText = "Folder listed. Select root XSD schema and click Generate.";
        } catch (e) {
            resetDropZone(`Error reading folder: ${e.message}`);
        }
    }

    // Handle file selection: single .xsd, .zip, or .tar.gz archive
    async function handleFile(file) {
        currentFile = file;
        currentFiles = null;
        showSelection(file.name);
        status.innerText = workerReady ? "Ready. Click Generate to proceed." : "Loading Python...";

        try {
            if (file.name.endsWith('.xsd')) {
                entryRow.style.display = 'none';
                entrySelect.innerHTML = "";
                entrySelect.disabled = true;
                btn.disabled = !workerReady;
            } else if (isTar(file)) {
                status.innerText = "Extracting archive...";
                const allFiles = await extractTar(file);
                entrySelect.innerHTML = "";
                Object.keys(allFiles)
                    .filter(n => n.endsWith('.xsd'))
                    .sort()
                    .forEach(name => {
                        const opt = document.createElement('option');
                        opt.value = name;
                        opt.innerText = name;
                        entrySelect.appendChild(opt);
                    });
                entrySelect.disabled = false;
                entryRow.style.display = '';
                btn.disabled = !workerReady;
                status.innerText = "Archive listed. Select root XSD schema and click Generate.";
            } else {
                const zip = await JSZip.loadAsync(file);
                entrySelect.innerHTML = "";
                const xsds = Object.keys(zip.files).filter(name => name.endsWith('.xsd'));

                xsds.forEach(name => {
                    const opt = document.createElement('option');
                    opt.value = name;
                    opt.innerText = name;
                    entrySelect.appendChild(opt);
                });

                entrySelect.disabled = false;
                entryRow.style.display = '';
                btn.disabled = !workerReady;
            }
        } catch (e) {
            resetDropZone(`Error reading file: ${e.message}`);
        }
    }

    zipInput.onchange = (e) => {
        if (e.target.files[0]) handleFile(e.target.files[0]);
    };

    // Drag & drop
    let dragCounter = 0;

    dropZone.addEventListener('dragenter', (e) => {
        e.preventDefault();
        dragCounter++;
        dropZone.classList.add('drag-over');
    });

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
    });

    dropZone.addEventListener('dragleave', () => {
        dragCounter--;
        if (dragCounter === 0) dropZone.classList.remove('drag-over');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dragCounter = 0;
        dropZone.classList.remove('drag-over');
        const item = e.dataTransfer.items && e.dataTransfer.items[0];
        if (item && item.webkitGetAsEntry) {
            const entry = item.webkitGetAsEntry();
            if (entry && entry.isDirectory) {
                handleDirectory(entry);
                return;
            }
        }
        const file = e.dataTransfer.files[0];
        if (file) handleFile(file);
    });

    // Prevent browser from opening dropped files outside the card
    document.addEventListener('dragover', (e) => e.preventDefault());
    document.addEventListener('drop', (e) => e.preventDefault());

    btn.onclick = async () => {
        const file = currentFile;
        const entryPoint = entrySelect.value;
        btn.disabled = true;

        try {
            if (currentFiles) {
                status.innerText = "Sending files to worker...";
                worker.postMessage({ type: 'convert', files: currentFiles, entryPoint });
            } else if (file.name.endsWith('.xsd')) {
                status.innerText = "Reading XSD file...";
                const buffer = await file.arrayBuffer();
                const files = { [file.name]: new Uint8Array(buffer) };
                status.innerText = "Sending file to worker...";
                worker.postMessage({ type: 'convert', files, entryPoint: file.name });
            } else if (isTar(file)) {
                status.innerText = "Extracting archive...";
                const files = await extractTar(file);
                status.innerText = "Sending files to worker...";
                worker.postMessage({ type: 'convert', files, entryPoint });
            } else {
                status.innerText = "Reading ZIP archive...";
                const zip = await JSZip.loadAsync(file);
                const files = {};
                const entries = Object.entries(zip.files);

                for (let i = 0; i < entries.length; i++) {
                    const [path, zipEntry] = entries[i];
                    if (zipEntry.dir) {
                        files[path] = null; // directory marker
                    } else {
                        files[path] = await zipEntry.async("uint8array");
                    }
                    status.innerText = `Reading ZIP (${i + 1}/${entries.length}): ${path}`;
                }

                status.innerText = "Sending files to worker...";
                worker.postMessage({ type: 'convert', files, entryPoint });
            }
        } catch (e) {
            status.innerText = `Error reading file: ${e.message}`;
            btn.disabled = false;
        }
    };
</script>

<footer class="landing-footer">
    <span>Experimental WASM implementation of <a href="https://github.com/tamtamresearch/xsd-browser">xsd-browser</a></span>
    <a href="https://www.tamtamresearch.com/">TamTam Research s.r.o.</a>
</footer>

</body>
</html>
