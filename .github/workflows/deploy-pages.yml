name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir dist
          cp web/* dist/
          cp src/xsd_browser/main.py dist/
          cp src/xsd_browser/main.html.j2 dist/
          cp src/xsd_browser/main.css dist/
          cp src/xsd_browser/main.js dist/
          sed -i "s|../src/xsd_browser/|./|g" dist/worker.js
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            BUILD_VERSION="$GITHUB_REF_NAME"
          else
            BUILD_VERSION="commit ${GITHUB_SHA:0:7}"
          fi
          sed -i "s|__BUILD_VERSION__|${BUILD_VERSION}|g" dist/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
