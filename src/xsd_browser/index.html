<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XSD Browser Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; background: #f4f7f6; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 400px; }
        select, button, input { width: 100%; margin: 10px 0; padding: 10px; border-radius: 5px; border: 1px solid #ddd; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:disabled { background: #ccc; }
        #status { font-size: 0.8rem; color: #666; text-align: center; }
        .landing-footer {
            position: fixed; bottom: 0; left: 0; right: 0;
            display: flex; justify-content: space-between; align-items: center;
            background-color: #2c3e50;
            padding: 10px 16px;
        }
        .landing-footer, .landing-footer span { color: #94a3b8; font-size: 13px; }
        .landing-footer a { color: #cbd5e1; font-size: 13px; text-decoration: none; }
        .landing-footer a:hover { color: #fff; text-decoration: underline; }
    </style>
</head>
<body>

<div class="card">
    <h2>XSD Parser</h2>
    <input type="file" id="zipInput" accept=".zip,.xsd" disabled>
    <select id="entrySelect" disabled><option>Select Entry XSD...</option></select>
    <button id="convertBtn" disabled>Loading Python...</button>
    <div id="status">Initializing...</div>
</div>

<script>
    const status = document.getElementById('status');
    const btn = document.getElementById('convertBtn');
    const entrySelect = document.getElementById('entrySelect');
    const zipInput = document.getElementById('zipInput');

    const worker = new Worker('worker.js');
    let workerReady = false;

    worker.onmessage = (e) => {
        const { type, data } = e.data;

        switch (type) {
            case 'status':
                status.innerText = data;
                break;
            case 'ready':
                workerReady = true;
                zipInput.disabled = false;
                btn.innerText = "Process Selected XSD";
                status.innerText = "Ready.";
                break;
            case 'result':
                const blob = new Blob([data.html], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `report_${data.entryPoint.replace('.xsd', '')}.html`;
                a.click();
                status.innerText = "Done! Report downloaded.";
                btn.disabled = false;
                break;
            case 'error':
                console.error(data);
                status.innerText = `Error: ${data}`;
                btn.disabled = false;
                break;
        }
    };

    // Handle file selection: single .xsd or .zip archive
    zipInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        if (file.name.endsWith('.xsd')) {
            entrySelect.innerHTML = "";
            const opt = document.createElement('option');
            opt.value = file.name;
            opt.innerText = file.name;
            entrySelect.appendChild(opt);
            entrySelect.disabled = true;
            btn.disabled = !workerReady;
        } else {
            const zip = await JSZip.loadAsync(file);
            entrySelect.innerHTML = "";
            const xsds = Object.keys(zip.files).filter(name => name.endsWith('.xsd'));

            xsds.forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.innerText = name;
                entrySelect.appendChild(opt);
            });

            entrySelect.disabled = false;
            btn.disabled = !workerReady;
        }
    };

    btn.onclick = async () => {
        const file = zipInput.files[0];
        const entryPoint = entrySelect.value;
        btn.disabled = true;

        if (file.name.endsWith('.xsd')) {
            status.innerText = "Reading XSD file...";
            const buffer = await file.arrayBuffer();
            const files = { [file.name]: new Uint8Array(buffer) };
            status.innerText = "Sending file to worker...";
            worker.postMessage({ type: 'convert', files, entryPoint });
        } else {
            status.innerText = "Reading ZIP archive...";
            const zip = await JSZip.loadAsync(file);
            const files = {};
            const entries = Object.entries(zip.files);

            for (let i = 0; i < entries.length; i++) {
                const [path, zipEntry] = entries[i];
                if (zipEntry.dir) {
                    files[path] = null; // directory marker
                } else {
                    files[path] = await zipEntry.async("uint8array");
                }
                status.innerText = `Reading ZIP (${i + 1}/${entries.length}): ${path}`;
            }

            status.innerText = "Sending files to worker...";
            worker.postMessage({ type: 'convert', files, entryPoint });
        }
    };
</script>

<footer class="landing-footer">
    <span>Experimental WASM implementation of <a href="https://github.com/tamtamresearch/xsd-browser">xsd-browser</a></span>
    <a href="https://www.tamtamresearch.com/">TamTam Research s.r.o.</a>
</footer>

</body>
</html>
