<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XSD Browser</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; background: #f4f7f6; margin: 0; }
        #title { margin-top: 0; }
        .card { background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 400px; }
        select, button, input { width: 100%; margin: 14px 0; padding: 10px; border-radius: 5px; border: 1px solid #ddd; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:disabled { background: #ccc; }
        #status { font-size: 0.8rem; color: #666; text-align: center; }
        .file-input-row { display: flex; align-items: center; gap: 8px; margin: 14px 0; }
        .file-input-row button { width: auto; margin: 0; padding: 8px 14px; flex-shrink: 0; }
        #fileNameDisplay { font-size: 0.85rem; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #entryLabel { font-size: 0.8rem; color: #555; display: block; margin-bottom: 2px; }
        #entryRow select { margin-top: 0; }
        #subtitle { font-size: 0.85rem; color: #666; margin: 0 0 24px; }
        .landing-footer {
            position: fixed; bottom: 0; left: 0; right: 0;
            display: flex; justify-content: space-between; align-items: center;
            background-color: #2c3e50;
            padding: 10px 16px;
        }
        .landing-footer, .landing-footer span { color: #94a3b8; font-size: 13px; }
        .landing-footer a { color: #cbd5e1; font-size: 13px; text-decoration: none; }
        .landing-footer a:hover { color: #fff; text-decoration: underline; }
    </style>
</head>
<body>

<div class="card">
    <h2 id="title">XSD Browser</h2>
    <p id="subtitle">Generate interactive, single-page HTML documentation from XSD (XML Schema) files. Upload a .xsd file, or a .zip / .tar.gz archive for multi-file schemas.</p>
    <div class="file-input-row">
        <button type="button" id="chooseFileBtn" disabled>Choose file</button>
        <span id="fileNameDisplay">No file chosen</span>
    </div>
    <input type="file" id="zipInput" accept=".zip,.xsd,.tar,.tar.gz,.gz,.tgz" disabled style="display:none">
<div id="entryRow" style="display:none">
        <label for="entrySelect" id="entryLabel">Select root XSD schema:</label>
        <select id="entrySelect" disabled><option>Select root XSD schema</option></select>
    </div>
    <hr style="border: none; border-top: 1px solid #e0e0e0; margin: 0 0 0;">
    <button id="convertBtn" disabled>Loading Python...</button>
    <div id="status">Initializing...</div>
</div>

<script>
    const status = document.getElementById('status');
    const btn = document.getElementById('convertBtn');
    const entrySelect = document.getElementById('entrySelect');
    const entryRow = document.getElementById('entryRow');
    const zipInput = document.getElementById('zipInput');
    const chooseFileBtn = document.getElementById('chooseFileBtn');
    const fileNameDisplay = document.getElementById('fileNameDisplay');

    chooseFileBtn.onclick = () => zipInput.click();

    const worker = new Worker('worker.js');
    let workerReady = false;

    worker.onmessage = (e) => {
        const { type, data } = e.data;

        switch (type) {
            case 'status':
                status.innerText = data;
                break;
            case 'ready':
                workerReady = true;
                zipInput.disabled = false;
                chooseFileBtn.disabled = false;
                btn.innerText = "Generate HTML";
                status.innerText = "Ready.";
                break;
            case 'result':
                const blob = new Blob([data.html], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `report_${data.entryPoint.replace('.xsd', '')}.html`;
                a.click();
                status.innerText = "Done! Report downloaded.";
                btn.disabled = false;
                break;
            case 'error':
                console.error(data);
                status.innerText = `Error: ${data}`;
                btn.disabled = false;
                break;
        }
    };

    function isTar(file) {
        return file.name.endsWith('.tar') || file.name.endsWith('.tar.gz') || file.name.endsWith('.tgz');
    }

    async function extractTar(file) {
        let bytes;
        if (file.name.endsWith('.tar.gz') || file.name.endsWith('.tgz')) {
            const ds = new DecompressionStream('gzip');
            file.stream().pipeTo(ds.writable);
            bytes = new Uint8Array(await new Response(ds.readable).arrayBuffer());
        } else {
            bytes = new Uint8Array(await file.arrayBuffer());
        }
        const files = {};
        let offset = 0;
        while (offset + 512 <= bytes.length) {
            const header = bytes.slice(offset, offset + 512);
            if (header.every(b => b === 0)) break;
            const name = new TextDecoder().decode(header.slice(0, 100)).replace(/\0.*/, '');
            const sizeOctal = new TextDecoder().decode(header.slice(124, 136)).trim().replace(/\0.*/, '');
            const size = parseInt(sizeOctal, 8) || 0;
            const typeFlag = String.fromCharCode(header[156]);
            offset += 512;
            if (typeFlag === '0' || typeFlag === '\0') {
                files[name] = bytes.slice(offset, offset + size);
            } else {
                files[name] = null; // directory
            }
            offset += Math.ceil(size / 512) * 512;
        }
        return files;
    }

    // Handle file selection: single .xsd, .zip, or .tar.gz archive
    zipInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        fileNameDisplay.textContent = file.name;

        if (file.name.endsWith('.xsd')) {
            entryRow.style.display = 'none';
            entrySelect.innerHTML = "";
            entrySelect.disabled = true;
            btn.disabled = !workerReady;
        } else if (isTar(file)) {
            status.innerText = "Extracting archive...";
            const allFiles = await extractTar(file);
            entrySelect.innerHTML = "";
            Object.keys(allFiles)
                .filter(n => n.endsWith('.xsd'))
                .sort()
                .forEach(name => {
                    const opt = document.createElement('option');
                    opt.value = name;
                    opt.innerText = name;
                    entrySelect.appendChild(opt);
                });
            entrySelect.disabled = false;
            entryRow.style.display = '';
            btn.disabled = !workerReady;
            status.innerText = "Archive listed. Select root XSD schema and click Generate.";
        } else {
            const zip = await JSZip.loadAsync(file);
            entrySelect.innerHTML = "";
            const xsds = Object.keys(zip.files).filter(name => name.endsWith('.xsd'));

            xsds.forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.innerText = name;
                entrySelect.appendChild(opt);
            });

            entrySelect.disabled = false;
            entryRow.style.display = '';
            btn.disabled = !workerReady;
        }
    };

    btn.onclick = async () => {
        const file = zipInput.files[0];
        const entryPoint = entrySelect.value;
        btn.disabled = true;

        if (file.name.endsWith('.xsd')) {
            status.innerText = "Reading XSD file...";
            const buffer = await file.arrayBuffer();
            const files = { [file.name]: new Uint8Array(buffer) };
            status.innerText = "Sending file to worker...";
            worker.postMessage({ type: 'convert', files, entryPoint: file.name });
        } else if (isTar(file)) {
            status.innerText = "Extracting archive...";
            const files = await extractTar(file);
            status.innerText = "Sending files to worker...";
            worker.postMessage({ type: 'convert', files, entryPoint });
        } else {
            status.innerText = "Reading ZIP archive...";
            const zip = await JSZip.loadAsync(file);
            const files = {};
            const entries = Object.entries(zip.files);

            for (let i = 0; i < entries.length; i++) {
                const [path, zipEntry] = entries[i];
                if (zipEntry.dir) {
                    files[path] = null; // directory marker
                } else {
                    files[path] = await zipEntry.async("uint8array");
                }
                status.innerText = `Reading ZIP (${i + 1}/${entries.length}): ${path}`;
            }

            status.innerText = "Sending files to worker...";
            worker.postMessage({ type: 'convert', files, entryPoint });
        }
    };
</script>

<footer class="landing-footer">
    <span>Experimental WASM implementation of <a href="https://github.com/tamtamresearch/xsd-browser">xsd-browser</a></span>
    <a href="https://www.tamtamresearch.com/">TamTam Research s.r.o.</a>
</footer>

</body>
</html>
